<!DOCTYPE html>
<html lang="zh-CN" data-ui-default="modern">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七子麻将 · 四人游戏</title>
<!-- 基础样式：含全部结构规则，任何时候都不得禁用 -->
<link rel="stylesheet" href="css/game.css">
<!-- 现代皮肤（覆盖层）：仅当 <html data-ui="modern"> 时生效 -->
<link rel="stylesheet" href="css/theme-modern.css">
<script>
// 尽早标上 data-ui，避免样式闪烁（具体逻辑见 js/game.js 末尾）
(function(){var K="oc_ui_version",V=["classic","modern"],r=document.documentElement;var d=r.getAttribute("data-ui-default")||"classic",s=null;try{s=localStorage.getItem(K)}catch(e){}var q=null;try{q=new URLSearchParams(location.search).get("ui")}catch(e){}r.setAttribute("data-ui", V.indexOf(q)>=0?q:(V.indexOf(s)>=0?s:(V.indexOf(d)>=0?d:"classic")));})();
</script>

</head>
<body>
<div class="app">
<div class="table" id="table">
    <div class="top-left-info" id="topLeftInfo">
        <div class="tli-item" id="diceDealerLine" style="display:none"></div>
        <div class="tli-item" id="diceCutLine" style="display:none"></div>
        <div class="tli-item">场次 <strong id="roundDisplay">东1局</strong> <span id="honbaDisplay"></span></div>
        <div class="tli-item">牌山 <strong id="wallCount">0</strong> 张</div>
        <div class="tli-item">岭上(马) <strong id="rinshanCount">4</strong> 张</div>
        <div class="tli-ma" id="tliMa"></div>
        <div class="tli-scores" id="tlScores"></div>
    </div>
    <div class="center-square" id="centerSquare">
        <div class="center-river-label">弃牌河（按出牌顺序）</div>
        <div class="pdiscards center-river" id="centerRiver"></div>
    </div>
    <div class="seat seat-top" id="seatTop"></div>
    <div class="seat seat-left" id="seatLeft"></div>
    <div class="seat seat-right" id="seatRight"></div>
    <div class="seat seat-bottom" id="seatBottom"></div>
    <div class="msg-overlay" id="msg" style="display:none"></div>
</div>
<div class="panel">
    <span class="label">🔍 手牌分析</span>
    <span class="content" id="handAnalysis">等待分析…</span>
</div>
<div class="msglog" id="msgLog"><span>七子麻将 · 四人对局 · 点击手牌直接出牌</span></div>
<div class="wall-viewer" id="wallViewer" style="display:none">
    <div class="wv-tabs">
        <button class="wv-tab active" id="wvTabWall" onclick="showWallTab('wall')">牌山</button>
        <button class="wv-tab" id="wvTabRinshan" onclick="showWallTab('rinshan')">王牌堆(岭上)</button>
        <span class="wv-legend" style="margin-left:auto">
            <span><span class="sw" style="background:#f6f1e3;border:2px solid #ffd84a"></span>赋马牌</span>
            <span><span class="sw" style="background:#f6f1e3;border:2px solid #4aa3ff"></span>王牌堆</span>
        </span>
    </div>
    <div class="wv-body" id="wvBody"></div>
</div>
<div class="runtime-bar">
    <span class="dbg-label">⏱ 长考 <strong id="thinkDisplay">30</strong>s</span>
    <button class="btn btn-sm btn-auto" id="autoBtn">全自动</button>
    <button class="btn btn-sm btn-secondary" id="nextRoundBtn">下一局</button>
    <button class="btn btn-sm btn-danger" id="resetBtn">重置</button>
    <span class="dbg-label" style="margin-left:8px;">速度</span>
    <select id="speedSel" style="background:#0f1f0d;color:#f5efc0;border:1px solid #4d7340;border-radius:10px;padding:4px 8px;font-size:13px">
        <option value="600">慢</option>
        <option value="250" selected>中</option>
        <option value="60">快</option>
    </select>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:#d8e8c0;font-size:13px;margin-left:8px"><input type="checkbox" id="recordTilesChk" onchange="game.recordTiles=this.checked">记录牌型</label>
</div>
<div class="debug-log" id="debugLog"></div>
</div>
<script src="src/handAnalyzer.js"></script>
<script src="src/tiles.js"></script>
<script src="src/uuid.js"></script>
<script src="src/notation.js"></script>
<script src="src/tenpai.js"></script>
<script src="src/aiPlayer.js"></script>
<script src="src/winchecker.js"></script>
<script src="src/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
