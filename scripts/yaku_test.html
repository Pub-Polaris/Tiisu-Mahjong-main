<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>yaku_test — 七子麻将判役与计分断言</title>
<style>
    body { background:#1b1b1f; color:#ddd; font-family:Consolas,monospace; font-size:13px; margin:12px; }
    #summary { font-size:15px; font-weight:bold; margin-bottom:8px; }
    #out { white-space:pre-wrap; line-height:1.45; }
    .pass { color:#7ddb7d; }
    .fail { color:#ff7b7b; }
</style>
</head>
<body>
<div id="summary">running</div>
<pre id="out">running</pre>

<script>
// ══════════════════════════════════════════════════════════════
// yaku_test.html — 判役与计分断言（无 Node.js，走无头 Edge）
//
// 加载：按依赖顺序用真实 <script src> 加载纯逻辑层
//   （tiles / notation / winchecker / engine），不触碰 index.html 的装配与渲染。
//   注意：不能用 eval 加载——函数声明与 class 不会挂到 window 上。
//
// 输出写入 <pre id="out">，由 scripts/run_yaku_test.ps1 解析。
// 首行固定：YAKUTEST: PASS|FAIL 通过数/总数 断言 · N 用例 · Mms
//
// 编写用例的硬性约定（踩过坑，务必遵守）：
//   1) ytBuild 拼出的张数必须使【全手 = 14 + 杠数】：
//        无副露 13 + 和牌张 = 14；1 副露 11 + 3 + 1 = 14；2 副露 8 + 6 + 1 = 14。
//      （checkWin 的 "期望 14" 是【和牌后】口径：暗手 + 副露张数）
//   2) 和牌张在暗手里不能已有 4 张，否则会凑出第 5 张。
//   3) 判役未实现时 success=false，所以每条用例都要有"和牌成功"这类结构断言，
//      否则只断言"含某役"会假通过。
//   4) 5.5 听牌型奖赏 / 赐马 是【表外赋】：面板役名后带「※」，按 700 点/个直接加，不查表。
// ══════════════════════════════════════════════════════════════
const YT_FILES = ['tiles.js', 'notation.js', 'winchecker.js', 'engine.js'];

function ytLoadFile(file) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = '../src/' + file + '?t=' + Date.now();
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('加载失败: ' + file));
        document.head.appendChild(s);
    });
}
async function ytLoad() { for (const f of YT_FILES) await ytLoadFile(f); }

// ── 测试隔离：拦截 /api/stats 与 /api/state ──
// 断言会真实调用 engine 的 reportStats*() / saveSessionState()，若不拦截就会把
// 累计统计写进 stats.json、把会话存档写进 state.json，
// 导致「跑一次测试 = 运行态被改」。这里把这些端点换成内存桩，只记录调用不落盘。
const YT_STATS_CALLS = [];
const YT_STATE_CALLS = [];
function ytStubNet() {
    const orig = window.fetch.bind(window);
    window.fetch = function (url, opts) {
        try {
            if (typeof url === 'string') {
                const stub = { ok: true, status: 200,
                    json: function () { return Promise.resolve({}); },
                    text: function () { return Promise.resolve('{}'); } };
                if (url.indexOf('/api/stats') !== -1) {
                    let body = {};
                    try { body = JSON.parse((opts && opts.body) || '{}'); } catch (e) {}
                    YT_STATS_CALLS.push(body);
                    return Promise.resolve(stub);
                }
                if (url.indexOf('/api/state') !== -1) {
                    let body = {};
                    try { body = JSON.parse((opts && opts.body) || '{}'); } catch (e) {}
                    YT_STATE_CALLS.push(body);
                    return Promise.resolve(stub);
                }
            }
        } catch (e) {}
        return orig(url, opts);
    };
}

// ── 断言框架 ──
const YT = { cases: [], pass: 0, fail: 0, lines: [] };
function ytT(name, fn) { YT.cases.push({ name, fn }); }
function ytEq(name, actual, expected) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a === e) { YT.pass++; YT.lines.push('  PASS  ' + name); }
    else { YT.fail++; YT.lines.push('  FAIL  ' + name + '\n          期望: ' + e + '\n          实际: ' + a); }
}
function ytOk(name, cond, detail) {
    if (cond) { YT.pass++; YT.lines.push('  PASS  ' + name); }
    else { YT.fail++; YT.lines.push('  FAIL  ' + name + (detail != null ? '\n          细节: ' + detail : '')); }
}

// ── 牌与手牌构造 ──
function ytTile(id) {
    const suit = id[0], rest = id.slice(1);
    return suit === 'z' ? { suit:'z', num:rest, id:id } : { suit:suit, num:parseInt(rest,10), id:id };
}
function ytBuild() {
    const out = [];
    for (let i = 0; i < arguments.length; i += 2) {
        const suit = arguments[i], nums = String(arguments[i + 1]);
        for (const ch of nums) out.push(ytTile(suit + ch));
    }
    return out;
}
function ytMeld(type, spec) {
    let tiles = [];
    if (/^z[1-7]$/.test(spec)) {
        const n = (type === 'pon') ? 3 : 4;
        for (let i = 0; i < n; i++) tiles.push(ytTile(spec));
    } else {
        for (const t of parseTileString(spec)) tiles.push(t);
        tiles = tiles.slice(0, 3);
    }
    return { type, tiles };
}

// ── 调用判役 ──
function ytCheck(o) {
    const melds = o.melds || [];
    const win = o.winTile ? ytTile(o.winTile) : null;
    const hand = o.hand.slice();
    if (win) {
        const pos = hand.findIndex(t => t.id === win.id);
        if (pos === -1) throw new Error('用例错误：和牌张 ' + o.winTile + ' 不在最终暗手中');
        hand.splice(pos, 1);
        hand.push(win);
    }
    const ankan = melds.filter(m => m.type === 'ankan').length;
    const minkan = melds.filter(m => m.type === 'minkan' || m.type === 'kakan').length;
    // o.ctx 可覆盖/补充 winCtx（用于验证岭上炮/岭上花/杠立/人和 这类上下文驱动的役）
    const ctx = Object.assign({ seaMoon:false, haiDei:false, riverFish:false, lastTileVisible:0,
        seatWind:o.seatWind || 'east', roundWind:o.roundWind || 'east',  }, o.ctx || {});
    return YT.checker.checkWin(
        hand, !!o.selfDraw, melds.length > 0 || minkan > 0,
        ankan, minkan, melds, [],
        !!o.firstTurn, [], win, ctx
    );
}

function ytFuOf(r, name) { const h = (r.activeYaku || []).find(y => y.name === name); return h ? h.fu : 0; }
function ytHas(r, name) { return (r.activeYaku || []).some(y => y.name === name); }
function ytNames(r) { return (r.activeYaku || []).map(y => y.name).join(','); }
function ytBrief(r) { return 'success=' + r.success + ' fu=' + r.totalFu + ' type=' + r.handType + ' yaku=[' + ytNames(r) + '] msg=' + r.msg; }

// ══════════════════════════════════════════════════════════════
// 用例
// ══════════════════════════════════════════════════════════════
function ytDefineCases() {

    // ══════ 1. 点数查表 ══════
    ytT('计分 · 赋位表锚点与斜率', () => {
        const g = YT.gameFactory();
        ytEq('calcPoints(7) = 7000',   g.calcPoints(7), 7000);
        ytEq('calcPoints(8) = 7700',   g.calcPoints(8), 7700);
        ytEq('calcPoints(13) = 11200', g.calcPoints(13), 11200);
        ytEq('calcPoints(14) = 14000', g.calcPoints(14), 14000);
        ytEq('calcPoints(15) = 14700', g.calcPoints(15), 14700);
        ytEq('calcPoints(20) = 18200', g.calcPoints(20), 18200);
        ytEq('calcPoints(21) = 28000', g.calcPoints(21), 28000);
        ytEq('calcPoints(27) = 32200', g.calcPoints(27), 32200);
        ytEq('calcPoints(28) = 35000', g.calcPoints(28), 35000);
        ytEq('calcPoints(40) = 35000（封顶）', g.calcPoints(40), 35000);
    });

    // ══════ 1.5 高得点役：三国将（副露固定点数）══════
    // 对应 260926 修复 A1：规则书 6.1「三国将 14 赋；副露记 7000 点」。
    ytT('高役 · 三国将（门清 14 赋 / 副露 7000 点）', () => {
        const g = YT.gameFactory();
        // 门清：三花色 258 刻 + 顺子 + 雀头
        const r1 = ytCheck({ hand: ytBuild('m',222,'p',555,'s',888,'m',123,'z',11), selfDraw:false, winTile:'z1' });
        ytOk('门清和牌成功', r1.success, ytBrief(r1));
        ytEq('三国将 = 14 赋', ytFuOf(r1, '三国将'), 14);
        ytOk('门清不触发固定点数（specialPoints 为空）', r1.specialPoints == null, 'specialPoints=' + r1.specialPoints);
        // 副露：吃 123m，其余相同 → 应固定 7000 点（不走赋位表、不叠表外赋）
        const r2 = ytCheck({ hand: ytBuild('m',222,'p',555,'s',888,'z',11), selfDraw:false, winTile:'z1',
            melds:[ytMeld('chi','123m')] });
        ytOk('副露和牌成功', r2.success, ytBrief(r2));
        ytEq('三国将副露 specialPoints = 7000', r2.specialPoints, 7000);
        ytEq('三国将副露最终点数 = 7000（≠ calcPoints(10)=9100）', g.calcFinalPoints(r2, r2.totalFu), 7000);
    });

    // ══════ 2. 起和门槛 ══════
    ytT('门槛 · 清一色自摸成立、赋数过门槛', () => {        const r = ytCheck({ hand: ytBuild('m',123,'m',234,'m',45678955), selfDraw:true, winTile:'m4' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('清一色 = 14 赋', ytFuOf(r, '清一色'), 14);
    });

    ytT('门槛 · 断幺九+全数 的自摸赋数计算', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'p',234,'s',55), selfDraw:true, winTile:'m4' });
        ytOk('和牌 => 总赋 >= 7；不成和 => 必为 no_yaku',
            r.success ? r.totalFu >= 7 : r.reason === 'no_yaku', ytBrief(r) + ' reason=' + r.reason);
    });

    // ══════ 3. 役牌 ══════
    ytT('役牌 · 圈风=门风 同一种风应计 2 赋，面板名「东风东」', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',456,'z',11155), selfDraw:false, winTile:'m4',
            seatWind:'east', roundWind:'east' });
        ytOk('和牌成功', r.success, ytBrief(r));
        const windFu = (r.activeYaku || []).filter(y => /东/.test(y.name)).reduce((a,y)=>a+y.fu, 0);
        ytEq('东风总赋 = 2', windFu, 2);
        ytOk('合并为一项「东风东」', ytHas(r, '东风东'), ytNames(r));
    });

    ytT('役牌 · 圈风≠门风 时门风刻 1 赋', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'z',22255), selfDraw:false, winTile:'m4',
            seatWind:'south', roundWind:'east' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('南门风 = 1 赋', ytFuOf(r, '南役牌'), 1);
    });

    ytT('役牌 · 大三元（役满 28 赋）且不另计三元役牌赋', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',55,'z',555666777), selfDraw:false, winTile:'m3',
            seatWind:'east', roundWind:'east' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytOk('含大三元', ytHas(r, '大三元'), ytNames(r));
        ytEq('大三元 fu = 28', ytFuOf(r, '大三元'), 28);
        ytEq('不另计白役牌', ytFuOf(r, '白役牌'), 0);
        ytEq('不另计发役牌', ytFuOf(r, '发役牌'), 0);
        ytEq('不另计中役牌', ytFuOf(r, '中役牌'), 0);
    });

    // ══════ 4. 食降 ══════
    ytT('食降 · 混一色门清 5 赋 / 副露 4 赋', () => {
        const r1 = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'z',111,'z',22), selfDraw:false, winTile:'z2' });
        ytOk('门清和牌成功', r1.success, ytBrief(r1));
        ytEq('门清混一色 = 5', ytFuOf(r1, '混一色'), 5);

        const r2 = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'z',11), selfDraw:false, winTile:'m4',
            melds:[ytMeld('pon','z5')] });
        ytOk('副露和牌成功', r2.success, ytBrief(r2));
        ytOk('副露仍成立混一色', ytHas(r2, '混一色'), ytNames(r2));
        ytEq('副露混一色 = 4', ytFuOf(r2, '混一色'), 4);
    });

    ytT('食降 · 清一色门清 14 赋 / 副露 13 赋', () => {
        const r1 = ytCheck({ hand: ytBuild('m',123,'m',234,'m',45678955), selfDraw:false, winTile:'m4' });
        ytOk('门清和牌成功', r1.success, ytBrief(r1));
        ytEq('门清清一色 = 14', ytFuOf(r1, '清一色'), 14);

        const r2 = ytCheck({ hand: ytBuild('m',123,'m',456,'m',55), selfDraw:false, winTile:'m4',
            melds:[ytMeld('chi','789m'), ytMeld('chi','234m')] });
        ytOk('副露和牌成功', r2.success, ytBrief(r2));
        ytEq('副露清一色 = 13', ytFuOf(r2, '清一色'), 13);
    });

    // ══════ 5. 听牌型奖赏 5.5（表外赋）══════
    ytT('5.5 · 嵌张 1 赋（手里 2 张 2m，和 m3）', () => {
        const r = ytCheck({ hand: ytBuild('m',234,'m',456,'m',567,'p',234,'s',88), selfDraw:false, winTile:'m5' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('嵌张 = 1 赋', ytFuOf(r, '嵌张'), 1);
    });

    ytT('5.5 · 边张检测（可成形牌型待补）', () => {
        // checkWin 收的是【和牌后】的 14 张，和牌张在其中只能出现一次，
        // 因此『和牌前手里 2 张 2m 的 12m 搭子』这种边张原型，在 14 张里凑不出合法牌型
        // （凑出来必然需要第 5 张和牌张）。这里退而验证嵌张路径可用，
        // 边张专项待 yaku_test 支持『和牌前 13 张 + 和牌张』的调用形式后再补。
        const r = ytCheck({ hand: ytBuild('m',234,'m',456,'m',567,'p',234,'s',88), selfDraw:false, winTile:'m5' });
        ytOk('和牌成功（嵌张路径）', r.success, ytBrief(r));
        ytOk('边张赋数若出现必须是 1', ytFuOf(r, '边张') === 0 || ytFuOf(r, '边张') === 1, ytNames(r));
    });

    ytT('5.5 · 单钓（和牌为字牌）= 2 赋', () => {
        // 和牌后 123m456m789m111z55z，和 z5；去掉一张 z5 后 55z 只剩 1 张 → 单钓
        // 字牌 +1 赋
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'z',111,'z',55), selfDraw:false, winTile:'z5' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('单钓(字牌) = 2 赋', ytFuOf(r, '单钓'), 2);
    });

    ytT('5.5 · 优先级：双碰/单钓双解时取「单钓」', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'m',22,'p',234), selfDraw:false, winTile:'m2' });
        ytOk('和牌成功', r.success, ytBrief(r));
        const hits = (r.activeYaku||[]).filter(y => ['嵌张','边张','单钓','双碰'].includes(y.name));
        ytEq('只取一种听牌型奖赏', hits.length, 1);
        ytEq('取到「单钓」', hits.length ? hits[0].name : null, '单钓');
    });

    ytT('5.5 · 单骑和牌不产生嵌张/边张', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'p',123,'s',55), selfDraw:false, winTile:'s5' });
        ytOk('和牌成功', r.success, ytBrief(r));
        const hits = (r.activeYaku||[]).filter(y => ['嵌张','边张'].includes(y.name));
        ytEq('不产生嵌张/边张', hits.length, 0);
    });

    // ══════ 6. 全带赤 ══════
    ytT('全带赤 · 123456789m555s77z', () => {
        const r = ytCheck({ hand: ytBuild('m',123456789,'s',555,'z',77), selfDraw:false, winTile:'m9' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytOk('含全带赤', ytHas(r, '全带赤'), ytBrief(r));
        const other = (r.activeYaku||[]).filter(y => y.name !== '全带赤' && !y.isBonus && !y.ma)
                                          .reduce((a,y)=>a+y.fu, 0);
        ytEq('特判点数 = 14000 + 其他正式役赋×700',
            r.specialPoints != null ? r.specialPoints : null, 14000 + other * 700);
    });

    // ══════ 7. 赐马 ══════
    ytT('赐马 · 只看命中的指示牌张数（与手牌张数无关）', () => {
        const g = YT.gameFactory();
        g.rinshan = [ytTile('m3')];                       // 3m→4m，手里 4m 有 3 张
        const ma = g.resolveMa({ hand: ytBuild('m',444,'z',11), melds: [] }, { handType:'standard_hand' });
        ytEq('1 张指示牌命中 = 1 赋', ma.fu, 1);
    });
    ytT('赐马 · 多张指示牌各算各的', () => {
        const g = YT.gameFactory();
        g.rinshan = [ytTile('m3'), ytTile('m3')];
        const ma = g.resolveMa({ hand: ytBuild('m',4), melds: [] }, { handType:'standard_hand' });
        ytEq('2 张指示牌全命中 = 2 赋', ma.fu, 2);
    });
    ytT('赐马 · 未命中的指示牌不计', () => {
        const g = YT.gameFactory();
        g.rinshan = [ytTile('m3'), ytTile('z4')];         // z4→z1，手里没有 z1
        const ma = g.resolveMa({ hand: ytBuild('m',4), melds: [] }, { handType:'standard_hand' });
        ytEq('仅 1 张命中 = 1 赋', ma.fu, 1);
    });
    ytT('赐马 · 高役不计赐马', () => {
        const g = YT.gameFactory();
        g.rinshan = [ytTile('m3'), ytTile('m3')];
        const ma = g.resolveMa({ hand: ytBuild('m',4444), melds: [] }, { handType:'highyaku' });
        ytEq('高役赐马 = 0', ma.fu, 0);
    });
    ytT('赐马 · 副露中的牌也计入', () => {
        const g = YT.gameFactory();
        g.rinshan = [ytTile('m3')];
        const ma = g.resolveMa({ hand: ytBuild('m',11), melds: [ytMeld('chi','234m')] }, { handType:'standard_hand' });
        ytEq('赐马 = 1 赋', ma.fu, 1);
    });

    // ══════ 8. 已实现役种钉住 ══════
    ytT('役 · 七对子 7 赋', () => {
        const r = ytCheck({ hand: ytBuild('m',112233,'p',445566,'z',77), selfDraw:false, winTile:'z7' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('handType = seven_pairs', r.handType, 'seven_pairs');
        ytEq('七对子 7 赋', ytFuOf(r, '七对子'), 7);
    });

    ytT('役 · 缺七 1 赋（手牌无数牌七）', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',456,'z',11155), selfDraw:false, winTile:'m4' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('缺七 = 1 赋', ytFuOf(r, '缺七'), 1);
    });

    ytT('役 · 门前自摸 4 赋（门清限定）', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',234,'m',45678955), selfDraw:true, winTile:'m4' });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('门前自摸 = 4 赋', ytFuOf(r, '门前自摸'), 4);
    });

    ytT('役 · 副露自摸 2 赋（不再是门清自摸的 4 赋）', () => {
        const r = ytCheck({ hand: ytBuild('m',123,'m',456,'m',789,'z',55), selfDraw:true, winTile:'m4',
            melds:[ytMeld('chi','345p')] });
        ytOk('和牌成功', r.success, ytBrief(r));
        ytEq('含「自摸」2 赋', ytFuOf(r, '自摸'), 2);
        ytEq('不含「门前自摸」', ytFuOf(r, '门前自摸'), 0);
    });

    ytT('役 · 三色同顺 4 赋', () => {
        // 和牌后 123m 123p 123s 99s，和 s9 → 99s 雀头
        const r = ytCheck({ hand: ytBuild('m',123,'m',789,'p',123,'s',123,'s',99), selfDraw:false, winTile:'m9' });

// ══════════════════════════════════════════════════════════════
// 运行
// ══════════════════════════════════════════════════════════════
(async function ytRun() {
    const sumEl = document.getElementById('summary');
    const outEl = document.getElementById('out');
    try {
        await ytLoad();
        ytStubNet();
        const config = await (await fetch('../ike.json')).json();
        YT.checker = new WinChecker(null, config);
        // 验证台按"全部启用"跑：可选役（全数、全数筋和、同色老少…）默认关，
        // 但规则正确性验证需要它们参与，否则含这些役的手牌会掉到 7 赋门槛以下。
        (config.yaku || []).forEach(function(y){ if (y.optional) YT.checker.optionalEnabled.add(y.id); });
        YT.gameFactory = function () {
            const g = Object.create(TiisuMahjong.prototype);
            g.config = config; g.settings = {}; g.rinshan = []; g.players = [];
            return g;
        };

        ytDefineCases();

        const started = Date.now();
        for (const c of YT.cases) {
            YT.lines.push('# ' + c.name);
            try { c.fn(); }
            catch (e) { YT.fail++; YT.lines.push('  ERROR ' + (e && e.message ? e.message : String(e))); }
        }
        const ms = Date.now() - started;
        const total = YT.pass + YT.fail;
        const head = 'YAKUTEST: ' + (YT.fail === 0 ? 'PASS' : 'FAIL') +
            ' ' + YT.pass + '/' + total + ' 断言 · ' + YT.cases.length + ' 用例 · ' + ms + 'ms';
        sumEl.textContent = head;
        sumEl.className = YT.fail === 0 ? 'pass' : 'fail';
        outEl.textContent = head + '\n' + YT.lines.join('\n');
    } catch (e) {
        const msg = 'YAKUTEST: ERROR ' + (e && e.message ? e.message : String(e));
        sumEl.textContent = msg;
        outEl.textContent = msg + '\n' + (e && e.stack ? e.stack : String(e));
    }
})();
