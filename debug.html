<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七子麻将 · 调试控制台</title>
<style>
*{box-sizing:border-box}
body{background:#0f2b10;min-height:100vh;font-family:'Segoe UI',Roboto,sans-serif;margin:0;padding:24px;color:#e4f0d8}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{color:#ffe9a0;font-size:24px;margin:0 0 6px}
.card{background:#1c4a24;border:1px solid #4f9a58;border-radius:18px;padding:16px 20px}
.card h2{color:#ffe9a0;margin:0 0 12px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.btn{border:none;border-radius:12px;padding:9px 18px;font-weight:700;color:#eef7ea;cursor:pointer;font-size:14px;box-shadow:0 3px 0 #1a3a1a;background:#2a8a8a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1a3a1a}
.btn-danger{background:#8a4a4a}
.btn-primary{background:#d4a448;color:#1a1a0a}
.input{background:#0f2b14;border:1px solid #5a9a60;border-radius:10px;padding:7px 10px;color:#f8f0c8;font-size:14px;outline:none}
label{font-size:14px;color:#d8f0cc}
.check{display:flex;align-items:center;gap:6px;cursor:pointer}
.note{font-size:12px;color:#9bca9a}
#logBox{background:#0d250f;border:1px solid #4f8a58;border-radius:14px;padding:12px 16px;max-height:260px;overflow-y:auto;font-family:Consolas,'Courier New',monospace;font-size:12px;color:#b8d8b0;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
    <h1>🛠 七子麻将 · 调试控制台</h1>
    <div class="note">说明：运行时命令经 <code>/api/state.game_cmd</code> 发送给正在运行的游戏页，游戏每秒轮询执行后自动清除（不落盘为设置）。持久化设置走 <code>/api/settings</code>。</div>

    <div class="card">
        <h2>⏯ 运行时命令（作用于正在运行的对局）</h2>
        <div class="row">
            <button class="btn" onclick="sendCmd({action:'next'})">下一局</button>
            <button class="btn" onclick="sendCmd({action:'auto'})">切换全自动</button>
            <button class="btn btn-danger" onclick="sendCmd({action:'reset'})">重置对局</button>
            <button class="btn btn-primary" onclick="sendCmd({action:'flow'})">流局(九种九牌)</button>
        </div>
        <div class="row">
            <label>手牌调试（14张串，如 123m456p789s1122z）</label>
            <input class="input" id="dbgHand" style="width:250px" placeholder="123m456p789s1122z">
            <button class="btn" onclick="sendCmd({action:'setHand',hand:document.getElementById('dbgHand').value.trim()})">设定手牌</button>
        </div>
        <div class="row">
            <label>速度</label>
            <select class="input" id="dbgSpeed" onchange="sendCmd({action:'speed',speed:parseInt(this.value)})">
                <option value="600">慢</option>
                <option value="250" selected>中</option>
                <option value="60">快</option>
            </select>
        </div>
        <div class="note">也可在游戏页用键盘快捷键：N=下一局 · A=全自动 · R=重置(10s倒计时) · F=流局</div>
    </div>

    <div class="card">
        <h2>⚙️ 持久化设置（写入 settings.json，游戏页每次开局读取）</h2>
        <div class="row">
            <label>长考（秒，10–100）</label>
            <input class="input" id="setThink" type="number" value="30" min="10" max="100" style="width:70px">
        </div>
        <div class="row">
            <label class="check"><input type="checkbox" id="setShowMa">显示马牌</label>
            
            <label class="check"><input type="checkbox" id="setShowDebug">显示调试面板</label>
            <label class="check"><input type="checkbox" id="setRecord">默认记录牌型</label>
            <label class="check"><input type="checkbox" id="setShowWall">显示牌山（调试）</label>
        </div>
        <div style="font-size:14px;color:#b8d8a0;margin:8px 0 6px">可选役（默认禁用）</div>
        <div class="row">
            <label class="check"><input type="checkbox" class="opt" data-id="same_color_old_young">同色老少</label>
            <label class="check"><input type="checkbox" class="opt" data-id="same_color_double_old_young">同色双老少</label>
            <label class="check"><input type="checkbox" class="opt" data-id="two_color_double_old_young">双色双老少</label>
            <label class="check"><input type="checkbox" class="opt" data-id="double_even_ko">双双逢</label>
            <label class="check"><input type="checkbox" class="opt" data-id="triple_even_ko">三双逢</label>
        </div>
        <div class="row">
            <button class="btn" onclick="saveSettings()">💾 保存设置</button>
            <span class="note" id="saveNote"></span>
        </div>
    </div>

    <div class="card">
        <h2>📄 日志</h2>
        <div id="logBox"></div>
    </div>
</div>
<script>
function api(url, method, data) {
    return fetch(url, {
        method: method || 'GET',
        headers: data ? {'Content-Type':'application/json'} : {},
        body: data ? JSON.stringify(data) : undefined
    }).then(function(r){ return r.json(); });
}
function log(msg) {
    var el = document.getElementById('logBox');
    var line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    el.textContent += line + '\n';
    el.scrollTop = el.scrollHeight;
}
// 运行时命令：写入 state.game_cmd（游戏页轮询执行后清除，不落盘为设置）
async function sendCmd(cmd) {
    try {
        var st = await api('/api/state');
        var merged = Object.assign({}, st, { game_cmd: cmd });
        await api('/api/state', 'POST', merged);
        log('已发送命令: ' + JSON.stringify(cmd));
    } catch(e) { log('发送失败: ' + e.message); }
}
async function loadSettings() {
    try {
        var s = await api('/api/settings');
        document.getElementById('setThink').value = s.thinkSeconds || 30;
        document.getElementById('setShowMa').checked = !!s.showMa;
        
        document.getElementById('setShowDebug').checked = !!s.showDebug;
        document.getElementById('setRecord').checked = !!s.recordTiles;
        document.getElementById('setShowWall').checked = !!s.showWallViewer;
        var en = s.optionalYaku || [];
        document.querySelectorAll('.opt').forEach(function(cb){
            cb.checked = en.indexOf(cb.dataset.id) >= 0;
        });
    } catch(e) { log('读取设置失败'); }
}
async function saveSettings() {
    var opt = [];
    document.querySelectorAll('.opt').forEach(function(cb){ if (cb.checked) opt.push(cb.dataset.id); });
    var s = {
        thinkSeconds: parseInt(document.getElementById('setThink').value) || 30,
        showMa: document.getElementById('setShowMa').checked,
        
        showDebug: document.getElementById('setShowDebug').checked,
        recordTiles: document.getElementById('setRecord').checked,
        showWallViewer: document.getElementById('setShowWall').checked,
        optionalYaku: opt
    };
    try {
        await api('/api/settings', 'POST', s);
        document.getElementById('saveNote').textContent = '已保存 ✅';
        log('设置已保存');
        setTimeout(function(){ document.getElementById('saveNote').textContent=''; }, 2000);
    } catch(e) { log('保存失败: ' + e.message); }
}
loadSettings();
</script>
</body>
</html>
